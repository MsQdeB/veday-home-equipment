<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>So sánh báo giá thiết bị – Veday Home</title>
<style>
  :root{
    --green:#0b5c3b; --green2:#0e7a4e; --light:#f2f7f4; --line:#cfe0d7;
    --gold:#b8860b; --red:#b8312f; --ink:#15201b; --muted:#5a6b63; --bg:#f4f7f5;
  }
  *{ box-sizing:border-box; }
  body{ font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); margin:0; padding:20px; background:var(--bg); line-height:1.5; font-size:14.5px; }
  h1{ color:var(--green); font-size:23px; margin:0 0 3px; }
  h2{ color:var(--green); font-size:17px; margin:24px 0 10px; }
  .sub{ color:var(--muted); font-size:13px; margin:0; }
  a{ color:var(--green2); }
  header{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .lang{ background:#fff; border:1px solid var(--line); color:var(--green); border-radius:8px; padding:9px 14px; font-weight:700; cursor:pointer; font-size:13px; }
  .lang:hover{ background:var(--light); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:18px 0; }
  .card{ background:#fff; border-radius:12px; padding:13px 15px; box-shadow:0 1px 4px rgba(0,0,0,.06); border:1px solid #eaf1ed; }
  .card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:#7a8f89; }
  .card .value{ font-size:19px; font-weight:800; margin-top:4px; color:var(--green); }
  .card .note{ font-size:11px; color:#8a9d97; margin-top:2px; }
  .card.best .value{ color:var(--green2); }
  .card.save .value{ color:var(--gold); }

  .panel{ background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-bottom:18px; border:1px solid #eaf1ed; }
  .panel h2{ margin-top:0; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text], .toolbar select{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .toolbar input[type=text]{ width:190px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{ background:#fff; border:0; padding:8px 14px; cursor:pointer; font-size:13px; color:var(--green); font-weight:600; }
  .seg button.on{ background:var(--green); color:#fff; }
  .chk{ display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; }
  .chk input{ margin:0; }

  button.btn{ background:var(--green); color:#fff; border:none; padding:9px 15px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600; }
  button.btn:hover{ background:var(--green2); }
  button.ghost{ background:var(--light); color:var(--green); border:1px solid var(--line); }
  button.ghost:hover{ background:#e5efe9; }
  button.tiny{ padding:5px 10px; font-size:12px; }

  /* ---- comparison cards ---- */
  .cmp{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; background:#fff; }
  .cmp-head{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px; margin-bottom:10px; }
  .cmp-head .name{ font-size:15px; font-weight:800; color:var(--ink); }
  .cmp-head .spec{ font-size:12.5px; color:var(--muted); }
  .cmp-head .spread{ font-size:12px; color:var(--gold); font-weight:700; margin-left:auto; }
  .chip{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px; background:var(--light); color:var(--green); }
  .chip.cat{ background:#e8f0ea; color:var(--green); }

  .offers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .offer{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fbfdfc; position:relative; }
  .offer .ncc{ font-weight:800; font-size:13.5px; }
  .offer .model{ font-size:12px; color:var(--muted); min-height:16px; }
  .offer .price{ font-size:16px; font-weight:800; color:var(--ink); margin-top:6px; font-variant-numeric:tabular-nums; }
  .offer .total{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .offer .chips{ margin:7px 0 8px; display:flex; flex-wrap:wrap; gap:4px; }
  .inc{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:9px; }
  .inc.yes{ background:#e2f4e8; color:var(--green2); }
  .inc.no{ background:#f4f4f4; color:#a0a0a0; text-decoration:line-through; }
  .inc.w{ background:#fff2d6; color:var(--gold); }
  .offer.best{ border-color:var(--green2); box-shadow:0 0 0 2px rgba(14,122,78,.15); }
  .offer.best::after{ content:attr(data-best); position:absolute; top:-9px; left:10px; background:var(--green2); color:#fff; font-size:10px; font-weight:700; padding:1px 8px; border-radius:9px; }
  .offer.chosen{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,134,11,.2); background:#fffbf0; }
  .offer .acts{ display:flex; gap:6px; }
  .offer .note{ font-size:11px; color:var(--muted); margin-top:5px; font-style:italic; }

  .offer .rank{ position:absolute; top:8px; right:10px; font-size:11px; font-weight:800; color:#b9c4bf; }
  .offer.best .rank{ color:var(--green2); }
  .offer .save{ font-size:11px; color:var(--red); font-weight:700; margin-top:1px; }
  input.qin{ width:58px; padding:3px 5px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums; }
  .plan-sup{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
  .plan-sup h3{ margin:0 0 9px; color:var(--green); font-size:15px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .plan-sup h3 .sub2{ font-size:12px; color:var(--muted); font-weight:500; }
  .plan-total{ font-weight:800; }
  .mini{ font-size:11px; color:var(--muted); }
  .stars .st{ cursor:pointer; color:#c8d2cd; font-size:15px; }
  .stars .st.on{ color:#e6a700; }
  .starsrow{ margin:4px 0 2px; }
  .links{ display:flex; gap:6px; margin:2px 0 8px; flex-wrap:wrap; }
  .lbtn{ font-size:11px; text-decoration:none; background:var(--light); border:1px solid var(--line); color:var(--green); border-radius:8px; padding:2px 8px; }
  .lbtn:hover{ background:#e5efe9; }
  .ibtn{ background:none; border:0; cursor:pointer; font-size:15px; color:#c8d2cd; padding:0 2px; line-height:1; }
  .ibtn.on{ color:#e6a700; }
  .prange{ width:98px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; }
  .chg{ color:var(--red); font-weight:700; }
  /* ---- table ---- */
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th,td{ border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th{ background:var(--green); color:#fff; font-weight:600; font-size:12px; position:sticky; top:0; }
  tr:nth-child(even) td{ background:var(--light); }
  td.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.c{ text-align:center; white-space:nowrap; }
  .tblwrap{ overflow:auto; max-height:70vh; border-radius:10px; border:1px solid var(--line); }
  .tag{ display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; background:#eef4f0; color:var(--green2); }
  .tag.sample{ background:#fff2d6; color:var(--gold); }
  .b1win{ color:var(--green2); font-weight:800; }

  .note-box{ background:#eef4f0; border-left:5px solid var(--green2); border-radius:8px; padding:11px 14px; margin:12px 0; font-size:13px; }
  .warn-box{ background:#fff8e6; border-left:5px solid var(--gold); border-radius:8px; padding:11px 14px; margin:12px 0; font-size:13px; }
  .legend{ font-size:12px; color:var(--muted); }
  .empty{ text-align:center; color:var(--muted); padding:30px; }
  .sumtable td{ font-variant-numeric:tabular-nums; }

  form.entry{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
  form.entry label{ display:flex; flex-direction:column; font-size:11.5px; color:var(--muted); gap:3px; }
  form.entry input, form.entry select{ padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; width:100%; background:#fff; }
  form.entry .full{ grid-column:1/-1; }
  details.entrybox summary{ cursor:pointer; font-weight:700; color:var(--green); }

  .needwrap{ max-height:none; }
  summary.phead{ cursor:pointer; font-weight:800; color:var(--green); font-size:17px; list-style:none; display:flex; align-items:center; gap:8px; }
  summary.phead::-webkit-details-marker{ display:none; }
  summary.phead::before{ content:"▸"; font-size:13px; }
  details[open] > summary.phead::before{ content:"▾"; }
  summary.phead:hover{ color:var(--green2); }
  .grouphdr td{ background:#e8f0ea; color:var(--green); font-weight:800; font-size:13px; }
  @media print{
    body{ padding:6mm; background:#fff; font-size:11.5px; }
    .noprint{ display:none !important; }
    .panel{ box-shadow:none; border:1px solid var(--line); page-break-inside:auto; }
    .cmp, .offer{ page-break-inside:avoid; }
    th{ position:static; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 data-vi="So sánh báo giá thiết bị – Veday Home" data-en="Equipment Price Comparison – Veday Home"></h1>
    <p class="sub" data-vi="Căn hộ Veday Home · Đà Nẵng · giai đoạn hoàn thiện · so sánh báo giá từ nhiều nhà cung cấp. Giá chỉ để tham khảo, cần xác nhận lại với nhà cung cấp."
       data-en="Veday Home · Đà Nẵng · finishing stage · compare quotes from multiple suppliers. Prices are for reference; confirm with the supplier."></p>
  </div>
  <div style="display:flex;gap:8px;" class="noprint">
    <button class="lang" id="langBtn">EN</button>
    <button class="lang" onclick="window.print()" data-vi="🖨 In" data-en="🖨 Print"></button>
  </div>
</header>

<div class="note-box noprint" style="text-align:center;font-size:13.5px;" data-vi="Cần mua gì? → xem <b>📋 Danh mục cần mua</b> &nbsp;·&nbsp; Giá tốt nhất? → <b>🔎 So sánh báo giá</b> &nbsp;·&nbsp; Đã chốt? → <b>🛒 Chốt mua tạm thời</b>" data-en="What to buy? → <b>📋 Shopping list</b> &nbsp;·&nbsp; Best price? → <b>🔎 Compare</b> &nbsp;·&nbsp; Decided? → <b>🛒 Shortlist</b>"></div>

<!-- ============ TEMP SHORTLIST (top) ============ -->
<div class="panel" style="border-color:var(--green);">
  <h2 data-vi="🛒 Chốt mua tạm thời (danh sách nháp)" data-en="🛒 Temporary shortlist (draft picks)"></h2>
  <div id="plan"></div>
</div>

<!-- ============ KPIs ============ -->
<div class="grid" id="kpis"></div>

<!-- ============ SHOPPING LIST (collapsible) ============ -->
<div class="panel">
  <details id="needBox">
    <summary class="phead" id="needSummary" data-vi="📋 Danh mục cần mua (số lượng)" data-en="📋 Shopping list (quantities)"></summary>
    <div id="need" style="margin-top:12px;"></div>
  </details>
</div>


<!-- ============ COMPARE ============ -->
<div class="panel noprint">
  <h2 data-vi="🔎 So sánh báo giá theo món" data-en="🔎 Compare prices by item"></h2>
  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-view="cmp" class="on" data-vi="🔀 So sánh" data-en="🔀 Compare"></button>
      <button data-view="all" data-vi="📋 Bảng tất cả" data-en="📋 All quotes"></button>
    </div>
    <input type="text" id="q" data-ph-vi="🔎 Tìm hạng mục / NCC…" data-ph-en="🔎 Search item / supplier…">
    <select id="fcat"></select>
    <select id="fsup"></select>
    <select id="fitem"></select>
    <input type="number" id="pmin" class="prange" data-vi="Giá từ" data-en="Price ≥">
    <input type="number" id="pmax" class="prange" data-vi="đến" data-en="≤">
    <label class="chk"><input type="checkbox" id="fInstall"><span data-vi="Có lắp đặt" data-en="Includes install"></span></label>
    <label class="chk"><input type="checkbox" id="fDelivery"><span data-vi="Có vận chuyển" data-en="Includes delivery"></span></label>
    <label class="chk"><input type="checkbox" id="fVat"><span data-vi="Có VAT" data-en="Includes VAT"></span></label>
    <label class="chk"><input type="checkbox" id="fMulti"><span data-vi="Chỉ món có ≥2 báo giá" data-en="Only items with 2+ quotes"></span></label>
    <label class="chk"><input type="checkbox" id="fImp"><span data-vi="Chỉ món quan trọng ⭐" data-en="Only important ⭐"></span></label>
    <select id="fsort">
      <option value="cat" data-vi="Sắp xếp: Hạng mục" data-en="Sort: Category"></option>
      <option value="save" data-vi="Sắp xếp: Tiết kiệm nhiều" data-en="Sort: Biggest saving"></option>
      <option value="price" data-vi="Sắp xếp: Giá thấp" data-en="Sort: Lowest price"></option>
      <option value="imp" data-vi="Sắp xếp: Ưu tiên món quan trọng" data-en="Sort: Important first"></option>
    </select>
    <button class="btn ghost" onclick="exportCSV()" data-vi="💾 Export CSV" data-en="💾 Export CSV"></button>
    <button class="btn ghost" onclick="document.getElementById('importFile').click()" data-vi="📥 Import CSV" data-en="📥 Import CSV"></button>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button class="btn ghost" onclick="loadIngested()" data-vi="📥 Nạp lại dữ liệu báo giá" data-en="📥 Reload quotes"></button>
    <button class="btn ghost" onclick="clearAll()" data-vi="🧹 Xóa hết báo giá" data-en="🧹 Clear all quotes"></button>
  </div>
</div>

<!-- ============ MAIN ============ -->
<div id="view"></div>

<!-- ============ SUPPLIER SUMMARY (collapsible) ============ -->
<div class="panel">
  <details id="supBox">
    <summary class="phead" data-vi="🏬 Tổng hợp theo nhà cung cấp" data-en="🏬 Summary by supplier"></summary>
    <div id="supplierSummary" style="margin-top:12px;"></div>
  </details>
</div>

<!-- ============ ENTRY FORM ============ -->
<div class="panel noprint">
  <details class="entrybox" id="entryBox">
    <summary data-vi="➕ Thêm / sửa báo giá" data-en="➕ Add / edit a quote"></summary>
    <div style="margin-top:12px;">
      <form class="entry" id="entryForm" onsubmit="return saveOffer(event)">
        <input type="hidden" id="e_id">
        <label><span data-vi="Hạng mục (nhóm)" data-en="Category"></span>
          <select id="e_cat" required></select></label>
        <label><span data-vi="Tên hạng mục" data-en="Item name"></span>
          <input id="e_item" list="itemList" required></label>
        <label><span data-vi="Quy cách / mô tả" data-en="Spec / size"></span>
          <input id="e_spec"></label>
        <label><span data-vi="Đơn vị tính" data-en="Unit"></span>
          <input id="e_unit" list="unitList" placeholder="cái / bộ / m2 / m"></label>
        <label><span data-vi="Số lượng" data-en="Qty"></span>
          <input id="e_qty" type="number" step="any" min="0" value="1"></label>
        <label><span data-vi="Nhà cung cấp" data-en="Supplier"></span>
          <input id="e_supplier" list="supList" required></label>
        <label><span data-vi="Hãng / mã model" data-en="Brand / model"></span>
          <input id="e_model"></label>
        <label><span data-vi="Đơn giá (VND)" data-en="Unit price (VND)"></span>
          <input id="e_price" type="number" step="any" min="0" required></label>
        <label><span data-vi="Bảo hành (tháng)" data-en="Warranty (months)"></span>
          <input id="e_warranty" type="number" step="1" min="0" value="0"></label>
        <label><span data-vi="Nguồn báo giá" data-en="Quote source"></span>
          <select id="e_source">
            <option value="pdf">PDF</option><option value="excel">Excel</option>
            <option value="photo" data-vi="Ảnh chụp" data-en="Photo">Ảnh chụp</option>
            <option value="manual" data-vi="Gõ tay" data-en="Typed">Gõ tay</option>
          </select></label>
        <label class="full"><span data-vi="Giá đã gồm (tick những gì báo giá bao gồm)" data-en="What the price includes (tick all that apply)"></span></label>
        <label class="chk" style="flex-direction:row;grid-column:span 1;"><input type="checkbox" id="e_install"><span data-vi="Công lắp đặt" data-en="Installation"></span></label>
        <label class="chk" style="flex-direction:row;"><input type="checkbox" id="e_delivery"><span data-vi="Vận chuyển" data-en="Delivery"></span></label>
        <label class="chk" style="flex-direction:row;"><input type="checkbox" id="e_vat"><span data-vi="VAT / thuế" data-en="VAT / tax"></span></label>
        <label class="full"><span data-vi="Ghi chú" data-en="Note"></span>
          <input id="e_note"></label>
        <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="submit" class="btn" data-vi="💾 Lưu báo giá" data-en="💾 Save quote"></button>
          <button type="button" class="btn ghost" onclick="resetForm()" data-vi="Xóa trắng form" data-en="Clear form"></button>
          <span class="legend" id="formHint" style="align-self:center;"></span>
        </div>
      </form>
      <datalist id="itemList"></datalist>
      <datalist id="unitList"><option value="cái"><option value="bộ"><option value="m2"><option value="m"><option value="viên"><option value="thùng"><option value="gói"><option value="bình"></datalist>
      <datalist id="supList"></datalist>
    </div>
  </details>
  <div class="legend" style="margin-top:10px;" data-vi="Dữ liệu được lưu tự động trong trình duyệt (localStorage) trên máy này. Nhấn Import/Export CSV để chuyển dữ liệu giữa các máy hoặc sao lưu."
       data-en="Data is auto-saved in this browser (localStorage) on this device. Use Import/Export CSV to move data between devices or back it up."></div>
</div>

<!-- ============ HELP / DATA (collapsible, bottom) ============ -->
<div class="panel">
  <details id="helpBox">
    <summary class="phead" data-vi="ℹ️ Hướng dẫn & dữ liệu" data-en="ℹ️ Help & data"></summary>
    <div style="margin-top:12px;">
      <div class="note-box" data-vi="<b>Cách dùng:</b> <b>🛒 Chốt mua tạm thời</b> (trên cùng) là danh sách nháp bạn chọn mua — bấm <b>Chọn mua</b> ở tab <b>So sánh</b> để thêm. <b>📋 Danh mục cần mua</b> là danh sách món + số lượng cần mua (nhập tay hoặc Import CSV). Bảng so sánh bên dưới để so giá từng món."
  data-en="<b>How to use:</b> <b>🛒 Temporary shortlist</b> (top) is your draft pick list — click <b>Pick</b> in the <b>Compare</b> tab to add. <b>📋 Shopping list</b> is the items + quantities you need (add manually or Import CSV). The comparison below compares prices per item."></div>
      <p class="legend" style="margin-top:10px;" data-vi="Dữ liệu báo giá đã nạp sẵn từ thư mục Báo giá/; mọi thay đổi (chọn mua, SL, đánh giá) chỉ lưu trong trình duyệt của bạn." data-en="Quotes are preloaded from the Báo giá/ folder; any edits (picks, qty, ratings) are saved only in your browser."></p>
    </div>
  </details>
</div>

<script>
/* =====================================================================
   Veday Home – Equipment price comparison.  Single-file, no internet.
   ===================================================================== */

var CATS = [
  {k:'pccc',  vi:'PCCC (phòng cháy chữa cháy)', en:'Fire safety (PCCC)'},
  {k:'bep_tb',vi:'Thiết bị bếp',                en:'Kitchen appliances'},
  {k:'bep_nt',vi:'Nội thất bếp',                en:'Kitchen furniture'},
  {k:'vs',    vi:'Thiết bị vệ sinh',            en:'Sanitaryware'},
  {k:'gach',  vi:'Gạch ốp lát',                 en:'Tiles'},
  {k:'dien',  vi:'Điện & chiếu sáng',           en:'Electrical & lighting'},
  {k:'smarthome', vi:'Nhà thông minh',          en:'Smart home'},
  {k:'nlmt',  vi:'Điện mặt trời (NLMT)',        en:'Solar (PV)'},
  {k:'nt',    vi:'Nội thất',                    en:'Furniture'},
  {k:'bedding', vi:'Chăn ga gối nệm',            en:'Bedding'},
  {k:'khac',  vi:'Khác',                        en:'Other'}
];

var S = { lang:'vi', view:'cmp', offers:[], chosen:{}, qty:{}, rate:{}, imp:{}, need:[], rooms:6,
          f:{cat:'',sup:'',item:'',q:'',pmin:'',pmax:'',install:false,delivery:false,vat:false,multi:false,onlyimp:false,sort:'cat'} };

function L(){ return S.lang; }
function catName(k){ var c=CATS.filter(function(x){return x.k===k;})[0]; return c?c[L()]:k; }
function catOrder(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].k===k) return i; return 99; }
function itemKey(o){ return o.cat+'||'+(o.item||'').trim().toLowerCase(); }

function load(){
  try{
    var raw=localStorage.getItem('veday_quotes'); if(raw){ S.offers=JSON.parse(raw); }
    var ch=localStorage.getItem('veday_chosen'); if(ch) S.chosen=JSON.parse(ch);
    var qt=localStorage.getItem('veday_qty'); if(qt) S.qty=JSON.parse(qt);
    var rt=localStorage.getItem('veday_rate'); if(rt) S.rate=JSON.parse(rt);
    var im=localStorage.getItem('veday_imp'); if(im) S.imp=JSON.parse(im);
    var rm=localStorage.getItem('veday_rooms'); if(rm) S.rooms=(+rm||6);
    var nd=localStorage.getItem('veday_need');
    if(nd){ S.need=JSON.parse(nd); }
    else if(typeof NEED_SEED!=='undefined'){ S.need=NEED_SEED.map(function(x){ return Object.assign({},x); }); }
    var lg=localStorage.getItem('veday_lang'); if(lg) S.lang=lg;
  }catch(e){}
  if(!localStorage.getItem('veday_init_v2')){
    S.offers = INGESTED.map(mk); localStorage.setItem('veday_init_v2','1'); save();
  }
}
function save(){
  localStorage.setItem('veday_quotes', JSON.stringify(S.offers));
  localStorage.setItem('veday_chosen', JSON.stringify(S.chosen));
  localStorage.setItem('veday_qty', JSON.stringify(S.qty));
  localStorage.setItem('veday_rate', JSON.stringify(S.rate));
  localStorage.setItem('veday_imp', JSON.stringify(S.imp));
  localStorage.setItem('veday_need', JSON.stringify(S.need));
  localStorage.setItem('veday_rooms', String(S.rooms||6));
  localStorage.setItem('veday_lang', S.lang);
}
function uid(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function mk(o){ o=Object.assign({},o); if(!o.id) o.id=uid(); o.price=+o.price||0; o.qty=(o.qty===''||o.qty==null)?1:+o.qty; o.warranty=+o.warranty||0; return o; }

/* ---------------- helpers ---------------- */
function money(n){ return Math.round(n).toLocaleString('vi-VN')+' ₫'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function jsstr(s){ return "'"+String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
function attr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function offerById(id){ return S.offers.filter(function(x){return x.id===id;})[0]; }
function qtyOf(o){ var k=itemKey(o); return (S.qty[k]!=null)?+S.qty[k]:(o.qty||1); }
function tot(o){ return (o.price||0)*qtyOf(o); }
function bestOf(list){ var b=null; list.forEach(function(o){ if(b===null||tot(o)<tot(b)) b=o; }); return b; }
function setQty(key,v){ v=parseFloat(v)||0; if(v<=0) delete S.qty[key]; else S.qty[key]=v; save(); render(); }
function bindQtyInputs(root){ Array.prototype.forEach.call(root.querySelectorAll('input.qin[data-key]'), function(inp){ inp.addEventListener('change', function(){ setQty(inp.getAttribute('data-key'), inp.value); }); }); }
function chgPct(o,best){ if(!best||!tot(best)) return 0; return Math.round((tot(o)/tot(best)-1)*100); }
function researchUrl(o){ var q=((o.model||'')+' '+(o.item||'')).trim()||(o.item||''); return 'https://www.google.com/search?q='+encodeURIComponent(q); }
function youtubeUrl(o){ var q=((o.model||'')+' '+(o.item||'')).trim()||(o.item||''); return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }
function starsHTML(id){ var n=S.rate[id]||0, h='<span class="stars">'; for(var i=1;i<=5;i++){ h+='<span class="st'+(i<=n?' on':'')+'" onclick="setRating('+attr(jsstr(id))+','+i+')">'+(i<=n?'\u2605':'\u2606')+'</span>'; } return h+'</span>'; }
function setRating(id,n){ if(S.rate[id]===n) delete S.rate[id]; else S.rate[id]=n; save(); render(); }
function toggleImp(key){ if(S.imp[key]) delete S.imp[key]; else S.imp[key]=true; save(); render(); }
function renameItem(key){
  var o=S.offers.filter(function(x){return itemKey(x)===key;})[0]; if(!o) return;
  var nv=prompt(S.lang==='vi'?'\u0110\u1ed5i t\u00ean h\u1ea1ng m\u1ee5c (\u0111\u1eb7t c\u00f9ng t\u00ean \u0111\u1ec3 G\u1ed8P c\u00e1c b\u00e1o gi\u00e1 c\u00f9ng lo\u1ea1i l\u1ea1i):':'Rename item (use the same name to MERGE quotes of the same kind):', o.item);
  if(nv==null) return; nv=nv.trim(); if(!nv) return;
  var nk=o.cat+'||'+nv.toLowerCase();
  S.offers.forEach(function(x){ if(itemKey(x)===key) x.item=nv; });
  if(S.qty[key]!=null){ S.qty[nk]=S.qty[key]; delete S.qty[key]; }
  if(S.imp[key]){ S.imp[nk]=true; delete S.imp[key]; }
  if(S.chosen[key]){ S.chosen[nk]=S.chosen[key]; delete S.chosen[key]; }
  save(); render();
}

/* ---------------- filtering ---------------- */
function filtered(){
  var f=S.f, q=f.q.trim().toLowerCase();
  return S.offers.filter(function(o){
    if(f.cat && o.cat!==f.cat) return false;
    if(f.sup && o.supplier!==f.sup) return false;
    if(f.item && o.item!==f.item) return false;
    if(f.install && !o.install) return false;
    if(f.delivery && !o.delivery) return false;
    if(f.vat && !o.vat) return false;
    if(f.pmin!=='' && o.price < +f.pmin) return false;
    if(f.pmax!=='' && o.price > +f.pmax) return false;
    if(f.onlyimp && !S.imp[itemKey(o)]) return false;
    if(q){ var hay=((o.item||'')+' '+(o.supplier||'')+' '+(o.model||'')+' '+(o.spec||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function groupOffers(list){
  var g={};
  list.forEach(function(o){ var k=itemKey(o); (g[k]=g[k]||[]).push(o); });
  var arr=Object.keys(g).map(function(k){ return {key:k, offers:g[k]}; });
  var sort=S.f.sort;
  arr.sort(function(a,b){
    var A=a.offers[0], B=b.offers[0];
    if(sort==='cat'){ var d=catOrder(A.cat)-catOrder(B.cat); if(d) return d; return (A.item||'').localeCompare(B.item||''); }
    if(sort==='price'){ return bestOf(a.offers).price - bestOf(b.offers).price; }
    if(sort==='save'){ return grpSave(b)-grpSave(a); }
    if(sort==='imp'){ var ia=S.imp[a.key]?0:1, ib=S.imp[b.key]?0:1; if(ia!==ib) return ia-ib; var d2=catOrder(A.cat)-catOrder(B.cat); if(d2) return d2; return (A.item||'').localeCompare(B.item||''); }
    return 0;
  });
  return arr;
}
function grpSave(g){ var ts=g.map(tot); return Math.max.apply(null,ts)-Math.min.apply(null,ts); }
function allGroupKeys(){ var g={}; S.offers.forEach(function(o){ g[itemKey(o)]=1; }); return Object.keys(g); }

  CATS.forEach(function(c){ opts+='<option value="'+c.k+'">'+esc(c[L()])+'</option>'; });

  var eopts=''; CATS.forEach(function(c){ eopts+='<option value="'+c.k+'">'+esc(c[L()])+'</option>'; });
  eCat.innerHTML=eopts;

  var supSel=document.getElementById('fsup');
  var sups=[]; S.offers.forEach(function(o){ if(o.supplier && sups.indexOf(o.supplier)<0) sups.push(o.supplier); });
  sups.sort();
  var so='<option value="">'+ (L()==='vi'?'— Tất cả NCC —':'— All suppliers —') +'</option>';
  sups.forEach(function(s){ so+='<option value="'+esc(s)+'">'+esc(s)+'</option>'; });
  supSel.innerHTML=so; supSel.value=S.f.sup;

  var itemSel=document.getElementById('fitem');
  var items=[]; S.offers.forEach(function(o){ if(o.item && items.indexOf(o.item)<0) items.push(o.item); });
  items.sort(function(a,b){ return a.localeCompare(b); });
  var io='<option value="">'+ (L()==='vi'?'— Tất cả món —':'— All items —') +'</option>';
  items.forEach(function(it){ io+='<option value="'+esc(it)+'">'+esc(it)+'</option>'; });
  itemSel.innerHTML=io; itemSel.value=S.f.item;

  var itemDl=document.getElementById('itemList'), allItems=[];
  Object.keys(ITEMS).forEach(function(k){ ITEMS[k].forEach(function(it){ allItems.push(it); }); });
  S.offers.forEach(function(o){ if(o.item && allItems.indexOf(o.item)<0) allItems.push(o.item); });
  itemDl.innerHTML=allItems.sort().map(function(i){ return '<option value="'+esc(i)+'">'; }).join('');
  document.getElementById('supList').innerHTML=sups.map(function(s){ return '<option value="'+esc(s)+'">'; }).join('');
}

/* ---------------- render ---------------- */
function render(){
  document.documentElement.lang=L();
  document.getElementById('langBtn').textContent = (L()==='vi')?'EN':'VI';
  document.title = L()==='vi' ? 'So sánh báo giá thiết bị – Veday Home' : 'Equipment Price Comparison – Veday Home';
  document.querySelectorAll('[data-vi]').forEach(function(el){
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){ el.placeholder=el.getAttribute('data-'+L()); }
    else { el.innerHTML=el.getAttribute('data-'+L()); }
  });
  var q=document.getElementById('q'); if(q){ q.placeholder=q.getAttribute('data-ph-'+L()); }
  fillSelects();
  document.querySelectorAll('#viewSeg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-view')===S.view); });
  renderKPIs();
  if(S.view==='cmp') renderCompare(); else renderTable();
  renderPlan();
  renderNeed();
  renderSuppliers();
  save();
}

function renderKPIs(){
  var items={}, sups={};
  S.offers.forEach(function(o){ items[itemKey(o)]=1; sups[o.supplier]=1; });
  var nItems=Object.keys(items).length, nSup=Object.keys(sups).length;
  var chosenTotal=0, chosenN=0;
  Object.keys(S.chosen).forEach(function(k){ var o=offerById(S.chosen[k]); if(o){ chosenTotal+=tot(o); chosenN++; } });
  var k=function(label,val,note,cls){
    return '<div class="card '+(cls||'')+'"><div class="label">'+label+'</div><div class="value">'+val+'</div>'+(note?'<div class="note">'+note+'</div>':'')+'</div>';
  };
  var vi=L()==='vi';
  document.getElementById('kpis').innerHTML =
    k(vi?'Hạng mục':'Items', nItems, vi?'đang hỏi giá':'being quoted') +
    k(vi?'Nhà cung cấp':'Suppliers', nSup, vi?'đã gửi báo giá':'sent quotes') +
    k(vi?'Báo giá đã nhập':'Quotes entered', S.offers.length, vi?'dòng dữ liệu':'rows') +
    k(vi?'Đã chốt mua':'Picked to buy', money(chosenTotal), chosenN+'/'+nItems+' '+ (vi?'hạng mục':'items picked'));
}

/* ---------------- purchase plan ---------------- */
function chosenList(){
  return Object.keys(S.chosen).map(function(k){ var o=offerById(S.chosen[k]); return o?{key:k,o:o}:null; }).filter(Boolean);
}
function sumLines(lines){ return lines.reduce(function(a,x){ return a+tot(x.o); },0); }

/* ---------------- shopping list (danh mục cần mua) ---------------- */
function normName(x){ return String(x||'').toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function needMatch(name){
  var n=normName(name); if(!n) return [];
  var hits=[];
  S.offers.forEach(function(o){
    var on=normName(o.item); if(!on) return;
    if(on===n || (n.length>=5 && on.indexOf(n)>=0) || (on.length>=5 && n.indexOf(on)>=0)){ var k=itemKey(o); if(hits.indexOf(k)<0) hits.push(k); }
  });
  return hits;
}
function syncNeedQty(){ (S.need||[]).forEach(function(x){ needMatch(x.name).forEach(function(k){ S.qty[k]=x.qty; }); }); }
function addNeed(){
  var n=(document.getElementById('needName').value||'').trim(); if(!n) return;
  var q=parseFloat(document.getElementById('needQty').value)||1;
  var eg=document.getElementById('needGroup'); var grp=eg?(eg.value||'').trim():'';
  S.need.push({group:grp, name:n, desc:'', link:'', note:'', qty:q});
  document.getElementById('needName').value=''; document.getElementById('needQty').value=1;
  syncNeedQty(); save(); render();
}
function delNeed(i){ S.need.splice(i,1); save(); render(); }
function clearNeed(){ if(!confirm(L()==='vi'?'Xóa hết danh mục cần mua?':'Clear the shopping list?')) return; S.need=[]; save(); render(); }
function setNeedQty(i,v){ var q=parseFloat(v)||1; S.need[i].qty=q; syncNeedQty(); save(); render(); }
function setRooms(v){ S.rooms=Math.max(1, parseInt(v)||1); save(); render(); }
function bindNeedInputs(root){ Array.prototype.forEach.call(root.querySelectorAll('input.qin[data-need]'), function(inp){ inp.addEventListener('change', function(){ setNeedQty(+inp.getAttribute('data-need'), inp.value); }); }); }
function viewNeed(i){ var x=S.need[i]; var m=needMatch(x.name); if(!m.length) return; var o=S.offers.filter(function(y){ return itemKey(y)===m[0]; })[0]; S.view='cmp'; if(o) S.f.item=o.item; save(); render(); var v=document.getElementById('view'); if(v&&v.scrollIntoView) v.scrollIntoView({behavior:'smooth'}); }

function leadQty(s){ var m=String(s||'').match(/^\s*(\d+)\s*(cái|chiếc|chiec|cai|bộ|bo|ổ|o)\b/i); return m?+m[1]:0; }
function importNeedCSV(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var rows=parseCSV(r.result); if(!rows.length){ input.value=''; return; }
    var nameKeys=['món đồ','mon do','tên','ten','hạng mục','hang muc','item','name','sản phẩm','san pham','thiết bị','thiet bi','nội thất','noi that','chi tiết','chi tiet'];
    var descKeys=['miêu tả','mieu ta','mô tả','mo ta','mota','description','chi tiết','chi tiet','diễn giải','dien giai'];
    var linkKeys=['nơi mua','noi mua','link','url','website','nguồn','nguon'];
    var noteKeys=['lưu ý','luu y','ghi chú','ghi chu','note'];
    var qtyKeys=['sl','số lượng','so luong','qty','quantity'];
    function idxOf(keys,head){ for(var i=0;i<head.length;i++){ for(var k=0;k<keys.length;k++){ if(head[i].indexOf(keys[k])>=0) return i; } } return -1; }
    var head=rows[0].map(function(x){ return String(x).toLowerCase().trim(); });
    var nameIdx=idxOf(nameKeys,head); if(nameIdx<0) nameIdx=0;
    var descIdx=idxOf(descKeys,head), linkIdx=idxOf(linkKeys,head), noteIdx=idxOf(noteKeys,head), qtyIdx=idxOf(qtyKeys,head);
    var isHeader=function(cells){ var c0=String((cells[0]||'')).toLowerCase().trim(); return nameKeys.indexOf(c0)>=0; };
    var groupN=0, curGroup='', added=0;
    for(var ri=0; ri<rows.length; ri++){
      var c=rows[ri]; if(!c || c.join('').trim()==='') continue;
      if(isHeader(c)){ groupN++; curGroup=(L()==='vi'?'Nhóm ':'Group ')+groupN; continue; }
      var name=String(c[nameIdx]||'').trim();
      if(!name){ for(var j=0;j<c.length;j++){ var v=String(c[j]||'').trim(); if(v && isNaN(v.replace(/[.,]/g,''))){ name=v; break; } } }
      if(!name) continue;
      if(/^(tổng|cộng|sum|total|stt)\b/i.test(name)) continue;
      var q = qtyIdx>=0 ? parseFloat(String(c[qtyIdx]||'').replace(/[^0-9.]/g,'')) : NaN;
      if(!(q>0)) q = leadQty(descIdx>=0?c[descIdx]:'') || 1;
      S.need.push({group:curGroup, name:name.trim(), desc:String(descIdx>=0?(c[descIdx]||''):'').trim(), link:String(linkIdx>=0?(c[linkIdx]||''):'').trim(), note:String(noteIdx>=0?(c[noteIdx]||''):'').trim(), qty:q});
      added++;
    }
    save(); render();
    alert((L()==='vi'?'Đã nhập ':'Imported ')+added+(L()==='vi'?' dòng vào danh mục cần mua.':' rows into the shopping list.'));
    input.value='';
  };
  r.readAsText(f);
}

function dl(name,text){ var blob=new Blob([text],{type:'text/csv;charset=utf-8'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }

    rows.push([o.supplier,o.item,o.model||'',o.spec||'',o.unit||'',qtyOf(o),o.price,tot(o),incl.join(', ')]);

function parseCSV(text){
  var rows=[], cur=[], val='', q=false;
  text=text.replace(/\r\n/g,'\n').replace(/^\ufeff/,'');
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ val+='"'; i++; } else q=false; } else val+=ch; }
    else { if(ch==='"') q=true; else if(ch===','||ch==='\n'){ cur.push(val); val=''; if(ch==='\n'){ rows.push(cur); cur=[]; } } else val+=ch; }
  }
  if(val!==''||cur.length){ cur.push(val); rows.push(cur); }
  return rows;
}
function truthy(v){ v=String(v).trim().toLowerCase(); return v==='x'||v==='1'||v==='true'||v==='yes'||v==='có'||v==='co'||v==='v'; }
function importCSV(input){

  var r=new FileReader();
  r.onload=function(){
    var rows=parseCSV(r.result), head=rows.shift().map(function(h){return h.trim().toLowerCase();});
    var n=0;
    rows.forEach(function(cells){
      if(!cells.length || cells.join('').trim()==='') return;
      var o={}; head.forEach(function(h,i){ o[h]=cells[i]; });
      if(!o.item && !o.supplier) return;
      o.install=truthy(o.install); o.delivery=truthy(o.delivery); o.vat=truthy(o.vat);
      o.source=o.source||'import'; delete o.id;
      S.offers.push(mk(o)); n++;
    });
    save(); render();
    alert((L()==='vi'?'Đã nhập ':'Imported ')+n+(L()==='vi'?' dòng.':' rows.'));
    input.value='';
  };
  r.readAsText(f);
}
